<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OTTOhub 审核日志</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div>
                <h1>OTTOhub 审核日志</h1>
                <p class="subtitle">AI 自动审核操作记录</p>
            </div>
            <button id="btn-refresh" class="btn-primary">刷新</button>
        </header>
        <main class="content">
            <div id="log-summary" class="summary-bar"></div>
            <div class="table-wrap">
                <table id="log-table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>类型</th>
                            <th>ID</th>
                            <th>结果</th>
                        </tr>
                    </thead>
                    <tbody id="log-body"></tbody>
                </table>
            </div>
            <div id="log-empty" class="empty-state">暂无审核记录</div>
        </main>
    </div>
    <script src="./history_data.js"></script>
    <script src="./app.js"></script>
</body>
</html>
